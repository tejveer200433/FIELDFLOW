<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Site blocked by FieldFlow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 4rem auto; padding: 0 1.5rem; color: #1f2937; }
    h1 { font-size: 1.25rem; }
    p { line-height: 1.5; }
    .button { display: inline-block; margin: 1rem .5rem 0 0; padding: 0.6rem 1rem; border: 0; background: #2563eb; color: #fff; border-radius: 0.375rem; text-decoration: none; cursor: pointer; font: inherit; }
    .secondary { background: #e5e7eb; color: #111827; }
  </style>
</head>
<body>
  <h1>This site is blocked</h1>
  <p id="explanation">Your organization's monitoring policy blocks access to this site during work hours.</p>
  <p>If you need access for a work reason, request temporary access in FieldFlow. Your manager will review it.</p>
  <a id="request-link" class="button" href="#">Request access in FieldFlow</a>
  <button id="check-access" class="button secondary" type="button">Check approved access</button>
  <script type="module" src="blocked.js"></script>
</body>
</html>
