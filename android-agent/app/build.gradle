plugins { id 'com.android.application' }

def config = new Properties()
def configFile = rootProject.file('fieldflow.local.properties')
if (configFile.exists()) configFile.withInputStream { config.load(it) }
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.fieldflow.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.fieldflow.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'com.fieldflow.android.DeviceSmokeTest'
        buildConfigField 'String', 'API_URL', quoted(config.getProperty('apiUrl', 'https://fieldflow-henna.vercel.app'))
        buildConfigField 'String', 'SUPABASE_URL', quoted(config.getProperty('supabaseUrl', ''))
        buildConfigField 'String', 'SUPABASE_KEY', quoted(config.getProperty('supabaseKey', ''))
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
